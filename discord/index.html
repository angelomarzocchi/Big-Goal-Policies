<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Big Goal - Community</title>
  <meta name="description" content="The Big Goal community on Discord: bug reports, feature requests and release news." />
  <meta name="robots" content="noindex" />

  <!--
    This page exists only to be redirected away from.

    The app ships this url, not the discord.gg one: an invite code printed into a released binary
    cannot be corrected, so if the invite ever expires, is revoked, or the server is replaced, the
    fix is the one line below instead of a Play release that older installs would never receive.
  -->
  <meta http-equiv="refresh" content="0; url=https://discord.gg/pbKXt2Sw7p" />
  <link rel="canonical" href="https://discord.gg/pbKXt2Sw7p" />

  <style>
    :root {
      --bg: #f6f5fb;
      --surface: #ffffff;
      --text: #17151f;
      --muted: #5c5872;
      --primary: #685ca8;
      --border: #e1deef;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(1100px 500px at 20% -5%, #ebe7ff 0%, transparent 60%),
        radial-gradient(700px 380px at 90% 5%, #f8e9f4 0%, transparent 62%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    main {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 18px 40px -28px rgba(23, 21, 31, .35);
    }

    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }

    a.cta {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 999px;
    }

    a.cta:focus-visible { outline: 3px solid #17151f; outline-offset: 3px; }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #100e18;
        --surface: #1b1826;
        --text: #f3f1fa;
        --muted: #a9a4c0;
        --border: #2d2840;
      }
      body { background: var(--bg); }
      a.cta:focus-visible { outline-color: #f3f1fa; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Big Goal on Discord</h1>
    <p>Taking you to the invite. If nothing happens, open it yourself:</p>
    <a class="cta" href="https://discord.gg/pbKXt2Sw7p">Join the server</a>
  </main>
</body>
</html>
